{% extends "base.html" %}

{% block body_class %}edit{% endblock %}

{% block content %}
  <h1>{{ title }}</h1>

  <form action="{{ url_for('edit', id=game['id']) }}" method="post" class="edit-form">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ game['title'] }}" required>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" required>{{ game['description'] }}</textarea>
    </div>
    <div class="form-group">
      <input type="submit" value="Submit">
    </div>
  </form>

  <ul class="action-list">
    <li><a href="{{ url_for('index') }}">Back to list</a></li>
    <li>
      <form action="{{ url_for('delete', id=game['id']) }}" method="post" style="display:inline;">
        <input type="submit" value="Delete" onclick="return confirm('Are you sure?')">
      </form>
    </li>
  </ul>
{% endblock %}
